services:
  docker-staticmaps:
    image: mxdcodes/docker-staticmaps:latest@sha256:d31d8f5cb622e7b028b066a1afe5efdb0a7bc037f80dd0eca5b8ac8109ab2d1e
    container_name: docker-staticmaps
    restart: always
    ports:
      - "3000:3000"
    environment:
      - API_KEY=your_api_key
      - LOG_LEVEL="INFO"
      - TILE_CACHE_TTL=3600
      - RATE_LIMIT_MS=60000
      - RATE_LIMIT_MAX=60
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
