services:
  docker-staticmaps:
    image: mxdcodes/docker-staticmaps:latest@sha256:89d4005cf6d56667c8b5abfde2e948ad1ab1491b226a0dc4187e562d2f9b3669
    container_name: docker-staticmaps
    restart: always
    ports:
      - "3000:3000"
    environment:
      - API_KEY=your_api_key
      - LOG_LEVEL="INFO"
      - TILE_CACHE_TTL=3600
      - RATE_LIMIT_MS=60000
      - RATE_LIMIT_MAX=60
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
