services:
  docker-staticmaps:
    image: mxdcodes/docker-staticmaps:latest@sha256:e4c2fb849fc2e83f02a7dcbaca6dbd607a3ca83126a7b3b7a35229f24c37a8cd
    container_name: docker-staticmaps
    restart: always
    ports:
      - "3000:3000"
    environment:
      - API_KEY=your_api_key
      - LOG_LEVEL="INFO"
      - TILE_CACHE_TTL=3600
      - RATE_LIMIT_MS=60000
      - RATE_LIMIT_MAX=60
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
