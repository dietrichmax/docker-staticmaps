name: Update Release Draft

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  autolabel:
    name: Label pull request
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.repo.full_name == 'dietrichmax/docker-staticmaps'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Apply labels
        uses: release-drafter/release-drafter/autolabeler@c345907820e0396f6f44bcfd9ac4763325f8feb0 # v7
        with:
          config-name: release-drafter.yml

  update_release_draft:
    name: Update release draft
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Update Release Draft
        uses: release-drafter/release-drafter@c345907820e0396f6f44bcfd9ac4763325f8feb0 # v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
